# test-publish.yml — DEV trial: build one wheel and publish it to TestPyPI on every
# push to main, then verify a clean-venv install. This filename is LOAD-BEARING:
# the TestPyPI pending publisher binds owner/repo/workflow-file exactly
# (B67687/ithmb-codec-dev, test-publish.yml). Do NOT rename without updating TestPyPI.
# Single target (x86_64-linux) for speed; same maturin invocation as release.yml.
# The public real-PyPI release (publish.yml, v* tags, 5 targets + sdist) is a
# later step and lives in the public repo — do NOT add it here.
name: test-publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit (zero tokens, rename)
    runs-on: ubuntu-latest
    if: github.repository == 'B67687/ithmb-codec-dev'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Zero-tokens audit (OIDC only)
        run: |
          # Match real secret material only (PyPI token format pypi-..., credential URLs,
          # twine/poetry password settings) — prose about token-free OIDC must NOT match.
          # The workflow file itself is excluded: any audit pattern written here would
          # otherwise match its own source text (self-match). That file is reviewed in PRs.
          # NOTE: --include MUST precede --exclude (grep last-match-wins); plus pipe-filter
          # for the two files whose own source text contains the patterns (self-match by
          # construction — both are PR-reviewed, never scanned for themselves).
          if grep -rEn 'pypi-[A-Za-z0-9_\-]{20,}|__token__@|//[^ /]*:[^ /]*@test\.pypi\.org|TWINE_(PASSWORD|USERNAME)[[:space:]]*=|POETRY_PYPI_TOKEN' . \
            --include='*.yml' --include='*.toml' --include='*.cfg' --include='*.ini' --include='*.env' \
            --exclude-dir=.git --exclude-dir=target --exclude-dir=.venv --exclude=uv.lock \
            | grep -v -e 'test-publish\.yml' -e 'verify-pypi-trial\.sh'; then
            echo 'FAIL: PyPI secret material found — OIDC trusted publishing only'
            exit 1
          fi
          echo 'ok: no PyPI secret material'
      - name: Rename audit (no ithmb-python outside flagged history)
        run: |
          # Flagged historical records — do NOT rewrite history:
          #   docs/EVOLUTION.md (release row), docs/adr/ (decision records),
          #   docs/standards/STANDARDS.md (incident row).
          if grep -rn 'ithmb-python' --include='*.toml' --include='*.md' --include='*.yml' . \
            --exclude-dir=.git --exclude-dir=target --exclude-dir=.venv --exclude-dir=.omo \
            --exclude-dir=docs --exclude=test-publish.yml; then
            echo 'FAIL: live ithmb-python reference remains'
            exit 1
          fi
          echo 'ok: rename complete outside flagged history'

  build-wheel:
    name: Build wheel (x86_64-linux only — trial)
    runs-on: ubuntu-latest
    if: github.repository == 'B67687/ithmb-codec-dev'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Stamp trial dev version (unique per run)
        run: |
          VER=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          STAMP="$VER-dev.$GITHUB_RUN_NUMBER"
          # Cargo version only bumps on releases, but TestPyPI rejects re-uploads —
          # so stamp a -dev.RUN suffix (Cargo-semver form; PyPI normalizes to .devRUN).
          # The stamp also rewrites every ithmb-core version requirement to the exact
          # stamped version: a bare pre-release no longer satisfies ^1.9-style ranges.
          # Dependents: pymod, ithmb-cli, ithmb-gen (wasm/fuzz are path-only, unaffected).
          # The verify job reads Cargo.toml dynamically, so version==installed stays consistent.
          sed -i "0,/^version = \".*\"/s//version = \"$STAMP\"/" Cargo.toml
          for dep in pymod/Cargo.toml crates/ithmb-cli/Cargo.toml crates/ithmb-gen/Cargo.toml; do
            sed -i "s|\(ithmb-core = { [^}]*version = \)\"[^\"]*\"|\1\"=$STAMP\"|" "$dep"
            grep '^ithmb-core' "$dep"
          done
          grep '^version = ' Cargo.toml | head -1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: true
          cache-key: "wheel-x86_64-unknown-linux-gnu-${{ hashFiles('rust-toolchain.toml') }}"
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install maturin==1.14.1
      - name: Build wheel
        run: maturin build --release --manifest-path pymod/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ithmb-codec-x86_64-unknown-linux-gnu
          path: target/wheels/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [audit, build-wheel]
    runs-on: ubuntu-latest
    if: github.repository == 'B67687/ithmb-codec-dev'
    environment: testpypi
    permissions:
      id-token: write # OIDC trusted publishing only
      contents: read # checkout needs this; without it a private repo 404s as 'not found'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: ithmb-codec-*
          merge-multiple: true
      - name: Check if this version is already on TestPyPI
        id: check
        run: |
          # The build job stamped the workspace version to BASE-dev.RUN (unique per run);
          # recompute the same stamp here — this job checks out fresh (unstamped) code.
          BASE=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          VER="$BASE-dev.$GITHUB_RUN_NUMBER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          # TestPyPI rejects re-uploads, and the Cargo version only bumps on
          # releases — so every dev push after the first trial of a version
          # would 400 without this skip.
          PAGE=$(curl -sSL 'https://test.pypi.org/simple/ithmb-codec/')
          # Our stamp is always BASE-dev.RUN; PEP 440 normalizes that to BASE.devRUN
          # in wheel filenames (dash dropped, not underscored).
          FILEVER="${VER/-dev./.dev}"
          if echo "$PAGE" | grep -q "ithmb_codec-$FILEVER"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "version $VER already on TestPyPI — publish step will skip"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "version $VER not on TestPyPI — will publish"
          fi
      - name: Publish to TestPyPI
        if: steps.check.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 as of 2026-07-28 (repo policy: SHA-pin actions)
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    name: Clean-venv install check
    needs: [publish-testpypi]
    runs-on: ubuntu-latest
    if: github.repository == 'B67687/ithmb-codec-dev'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install from TestPyPI into a clean venv and check version
        run: |
          # Same stamp recompute as the check step: verify the exact wheel this run built,
          # not the newest stable (pip would otherwise prefer 1.9.10 over 1.9.10-dev.N).
          BASE=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          CARGO_VER="$BASE-dev.$GITHUB_RUN_NUMBER"
          python -m venv /tmp/verify-venv
          # TestPyPI's simple index lags the upload by ~1-2 min: poll until the
          # exact stamped version is visible (max ~5 min), then install it.
          for i in $(seq 1 30); do
            # (pip/PEP 440 prints .devN while Cargo stamps -dev.N — match the index form).
            FILEVER="${CARGO_VER/-dev./.dev}"
            if /tmp/verify-venv/bin/pip index versions \
              --index-url https://test.pypi.org/simple/ \
              "ithmb-codec==$CARGO_VER" 2>/dev/null | grep -q "$FILEVER"; then
              echo "stamped version visible after ${i}x10s"; break
            fi
            sleep 10
          done
          /tmp/verify-venv/bin/pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "ithmb-codec==$CARGO_VER"
          /tmp/verify-venv/bin/python -c "
          import ithmb_core
          assert ithmb_core.__version__ == '$CARGO_VER', (
              f'version mismatch: installed {ithmb_core.__version__} != Cargo $CARGO_VER')
          assert len(ithmb_core.list_profiles()) == 53, 'expected 53 active profiles'
          print(f'ok: ithmb-codec {ithmb_core.__version__} == Cargo, 53 profiles')
          "
